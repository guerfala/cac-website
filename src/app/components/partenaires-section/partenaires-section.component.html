<section class="partenaires" *ngIf="partenaires.length > 0">
  <div class="partenaires-header" appReveal>
    <p class="section-label">Ils nous soutiennent</p>
    <h2 class="section-title">Nos Partenaires</h2>
  </div>

  <div class="carousel-wrapper" appReveal [revealDelay]="200">
    <div class="carousel-fade carousel-fade--left"></div>
    <div class="carousel-fade carousel-fade--right"></div>

    <div class="carousel-track">
      <!-- Premier jeu -->
      <a *ngFor="let p of partenaires"
         class="carousel-slide"
         [href]="p.url || '#'"
         [target]="p.url ? '_blank' : '_self'"
         rel="noopener noreferrer">
        <div class="logo-card">
          <img [src]="api.img(p.logo)" [alt]="p.nom" />
          <span class="logo-name">{{ p.nom }}</span>
        </div>
      </a>
      <!-- Duplication pour boucle infinie -->
      <a *ngFor="let p of partenaires"
         class="carousel-slide"
         [href]="p.url || '#'"
         [target]="p.url ? '_blank' : '_self'"
         rel="noopener noreferrer">
        <div class="logo-card">
          <img [src]="api.img(p.logo)" [alt]="p.nom" />
          <span class="logo-name">{{ p.nom }}</span>
        </div>
      </a>
    </div>
  </div>
</section>
