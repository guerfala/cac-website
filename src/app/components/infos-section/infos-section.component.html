<section class="infos">
  <div appReveal style="max-width: 1200px; margin: 0 auto;">
    <p class="section-label">Infos pratiques</p>
    <h2 class="section-title">Tout ce qu'il<br>faut savoir</h2>
  </div>

  <div class="infos-grid">
    <a
      class="info-card"
      *ngFor="let card of cards; let i = index"
      [routerLink]="card.route"
      appReveal
      [revealDelay]="i * 120"
    >
      <div class="info-card-icon">
        <svg *ngIf="card.icon === 'news'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 22h16a2 2 0 002-2V4a2 2 0 00-2-2H8a2 2 0 00-2 2v16a2 2 0 01-2 2zm0 0a2 2 0 01-2-2v-9c0-1.1.9-2 2-2h2"/>
          <line x1="10" y1="6" x2="18" y2="6"/><line x1="10" y1="10" x2="18" y2="10"/><line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
        <svg *ngIf="card.icon === 'clock'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <svg *ngIf="card.icon === 'calendar'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </div>
      <h3 class="info-card-title">{{ card.title }}</h3>
      <p class="info-card-desc">{{ card.desc }}</p>
      <span class="info-card-link">
        Découvrir
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </span>
    </a>
  </div>
</section>
