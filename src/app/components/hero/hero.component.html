<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <p class="hero-label">Courbevoie Athlétisme</p>
    <h1 class="hero-title">Rejoignez<br>Notre Club !</h1>
    <a href="https://courbevoie-athletisme.monclub.app/login" target="_blank" rel="noopener noreferrer" class="hero-cta">
      Rejoindre le club
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
  <div class="hero-scroll">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>
</section>

<div class="features-bar">
  <div class="feature" *ngFor="let f of features">
    <div class="feature-icon">
      <svg *ngIf="f.icon === 'club'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <svg *ngIf="f.icon === 'depasser'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
      </svg>
      <svg *ngIf="f.icon === 'equipe'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>
      </svg>
      <svg *ngIf="f.icon === 'events'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    <div class="feature-text">
      <h4 class="feature-title">{{ f.title }}</h4>
      <p class="feature-desc">{{ f.desc }}</p>
    </div>
  </div>
</div>
