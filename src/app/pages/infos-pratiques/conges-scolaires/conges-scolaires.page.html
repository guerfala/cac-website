<!-- ─── PAGE HERO ─── -->
<section class="page-hero">
  <div class="page-hero-bg"></div>
  <div class="page-hero-content">
    <span class="page-hero-label">Infos pratiques</span>
    <h1 class="page-hero-title">Congés<br>Scolaires</h1>
  </div>
</section>

<!-- ─── CALENDRIER ─── -->
<section class="conges-section">
  <div class="container">
    <div class="section-header" appReveal>
      <span class="section-label">Saison {{ saison }}</span>
      <h2 class="section-title">Calendrier des congés</h2>
      <p class="section-desc">
        Pas d'entraînement pendant les vacances scolaires, sauf indication contraire.
      </p>
    </div>

    <div class="timeline">
      <div class="timeline-line"></div>

      <div
        class="timeline-item"
        *ngFor="let c of conges; let i = index; let odd = odd"
        [class.timeline-item--right]="odd"
        appReveal
        [revealDelay]="i * 100"
      >
        <div class="timeline-dot">
          <!-- Leaf -->
          <svg *ngIf="c.icon === 'leaf'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75"/>
          </svg>
          <!-- Snowflake -->
          <svg *ngIf="c.icon === 'snowflake'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="4.93" y2="19.07"/>
          </svg>
          <!-- Cloud -->
          <svg *ngIf="c.icon === 'cloud'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/>
          </svg>
          <!-- Flower -->
          <svg *ngIf="c.icon === 'flower'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
          <!-- Calendar -->
          <svg *ngIf="c.icon === 'calendar'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <!-- Sun -->
          <svg *ngIf="c.icon === 'sun'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </div>

        <div class="timeline-card">
          <h3 class="timeline-card-title">{{ c.nom }}</h3>
          <div class="timeline-card-dates">
            <div class="date-block">
              <span class="date-label">Du</span>
              <span class="date-value">{{ formatDate(c.dateDebut) }}</span>
            </div>
            <div class="date-separator" *ngIf="c.dateFin">→</div>
            <div class="date-block" *ngIf="c.dateFin">
              <span class="date-label">Au</span>
              <span class="date-value">{{ formatDate(c.dateFin) }}</span>
            </div>
            <div class="date-block" *ngIf="!c.dateFin">
              <span class="date-label">Début</span>
              <span class="date-value">des vacances</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
